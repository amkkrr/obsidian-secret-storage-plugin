name: CI

# PR 触发的 CI 检查：类型检查 + 单元测试
# 供 main 分支保护规则「要求 status checks 通过」使用。
# 触发条件：push 到任意分支（含 PR 分支）时运行。

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
