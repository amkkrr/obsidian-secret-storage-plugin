name: CI

# PR 触发的 CI 检查：类型检查 + 构建 + 单元测试（含覆盖率门禁）
# 供 main 分支保护规则「要求 status checks 通过」使用。
# 触发条件：PR 到 main，或 push 到 main 时运行。
#
# 注意：job 的 name「Typecheck and test」同时是分支保护规则要求的
# status check context，改名会导致 main 分支保护失效。
# 覆盖率阈值（80%）在 vitest.config.ts 中定义，npm run test:coverage 不达标会失败。

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run test:coverage
