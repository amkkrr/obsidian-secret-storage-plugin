name: Release Obsidian plugin

# Obsidian 标准插件自动发布工作流（CI 构建 + 发布）
#
# 触发条件：推送与 manifest.json 中 version 字段匹配的 tag（例如 1.0.1）
# 工作内容：
#   1. 校验 tag 与 manifest.json 的 version 一致（不一致则中止）
#   2. npm ci 安装依赖、npm run build 从 TypeScript 源码编译出 main.js
#   3. 创建 GitHub Release 并附带 Obsidian 下载所需的三个资产：
#      main.js（CI 构建产物）、manifest.json、styles.css
#
# Obsidian 只会从 Release 资产中读取这三个文件，其余资产会被忽略。

on:
  push:
    tags:
      - '*'

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches manifest.json version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          manifest_version=$(jq -r '.version' manifest.json)
          echo "Git tag: $tag"
          echo "manifest.json version: $manifest_version"
          if [ "$tag" != "$manifest_version" ]; then
            echo "::error::Tag '$tag' 与 manifest.json 的 version '$manifest_version' 不一致，已中止发布。"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Check for styles.css
        id: styles
        run: |
          if [ -f styles.css ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release and upload plugin assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets="main.js manifest.json"
          if [ "${{ steps.styles.outputs.exists }}" = "true" ]; then
            assets="$assets styles.css"
          fi
          echo "Uploading assets: $assets"
          gh release create "$tag" \
            --title="$tag" \
            --generate-notes \
            $assets